<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willagrams</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.5 system-ui, sans-serif;
    max-width: 30rem;
    margin: 4rem auto;
    padding: 0 1rem;
    text-align: center;
  }
  #puzzle {
    font-size: 2.5rem;
    letter-spacing: 0.3em;
    font-weight: 600;
    margin: 2rem 0 1rem;
  }
  input, button {
    font: inherit;
    padding: 0.5rem 0.75rem;
  }
  #status { min-height: 1.5rem; margin-top: 1rem; }
  .wrong { color: #c0392b; }
  .right { color: #1e8449; }
</style>
</head>
<body>
  <h1>Willagrams</h1>
  <p>Unscramble the word.</p>
  <div id="puzzle"></div>
  <form id="form">
    <input id="guess" autocomplete="off" autofocus aria-label="Your guess">
    <button>Guess</button>
  </form>
  <p id="status" aria-live="polite"></p>
  <p>Score: <span id="score">0</span></p>

<script type="module">
import { WORDS, scramble, isCorrect } from './game.js';

const $ = (id) => document.getElementById(id);
let word, score = 0;

function next() {
  word = WORDS[Math.floor(Math.random() * WORDS.length)];
  $('puzzle').textContent = scramble(word);
  $('guess').value = '';
  $('guess').focus();
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  if (isCorrect($('guess').value, word)) {
    $('score').textContent = ++score;
    $('status').textContent = 'Correct.';
    $('status').className = 'right';
    next();
  } else {
    $('status').textContent = 'Not it. Try again.';
    $('status').className = 'wrong';
  }
});

next();
</script>
</body>
</html>
