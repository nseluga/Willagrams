# The free Supabase tier pauses a project after 7 days without database
# activity, and a paused project fails the app's launch sign-in — which leaves
# Play a Friend, Profile and Friends disabled. That is what App Review saw.
# One read every 3 days keeps it awake. The anon key is publishable.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://ynkayuwwrifluhhqnrjc.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
